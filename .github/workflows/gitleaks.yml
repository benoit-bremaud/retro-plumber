# Secret scanning — any leaked secret fails the run (required check on `main`).
# `-m` makes git log print the diff of merge commits too (conflict-resolution content).
# Runs the pinned gitleaks binary instead of gitleaks-action: the action hard-codes
# `--no-merges --first-parent`, which skips commits that only a merge's second parent introduced.
# Pull requests scan every commit reachable from the head and not from the base; push and the
# weekly schedule scan the full history. Read-only: findings fail the check, no PR comments.
name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' # linux_x64 tarball

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the scan covers every commit, not only HEAD
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --verbose --redact --log-opts="-m ${BASE_SHA}..${HEAD_SHA}"
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --verbose --redact --log-opts="-m --all"
