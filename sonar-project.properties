# Local SonarQube analysis. The token is never stored here: the global analysis token is
# exported as SONAR_TOKEN by ~/.zshrc (skill infra-accounts, "Token model").
sonar.projectKey=retro-plumber
sonar.projectName=retro-plumber
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.exclusions=node_modules/**,.git/**,coverage/**,dist/**
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=120
